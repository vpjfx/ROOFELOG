<style>
:root{--royal:#0A0A0A;--blue:#D90000;--ground:#F1F1F1;--line:#D4D4D4;--orange:#D90000;--navy:#FFFFFF;--yellow:#FF4D4D;--ink:#0A0A0A;--gray:#4B5563;--ok:#08813A;--bad:#B91C1C}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:500 16px/1.35 'Barlow Semi Condensed',sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,button,.num{font-family:Oswald,sans-serif}
header{background:var(--royal);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:4px solid var(--orange);display:flex;align-items:center;gap:8px}
header .wm{font:700 20px Oswald,sans-serif;letter-spacing:2px;flex:1}
header .wm b{color:#FF3B30}
header button{background:none;border:0;color:#fff;font-size:14px;min-height:44px;padding:0 6px;letter-spacing:.4px}
header .wm{min-width:0;white-space:nowrap}
header #mode{font-size:11px;padding:2px 8px;flex:none}
main{max-width:480px;margin:0 auto;padding:12px 16px 100px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav[hidden]{display:none}
#nav{z-index:2000}
.chip.bad{background:#FFC9C9;color:#7A0F0F}
.leaflet-container{font:inherit}
h2{font-family:Oswald,sans-serif}
#nav button{flex:1;min-height:60px;border:0;border-top:3px solid transparent;border-radius:0;background:none;font-size:13px;font-weight:600;color:var(--gray);letter-spacing:.3px;padding:0 2px}
#nav button[aria-current=true]{border-top-color:var(--orange);color:var(--ink);font-weight:700}
h1{font-size:30px;line-height:1.1;margin:8px 0 12px;text-transform:uppercase;letter-spacing:1px}
h2{font-size:18px;margin:16px 0 8px;letter-spacing:.4px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--gray);font-size:14px}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.blue{background:#0A0A0A;color:#FFFFFF}.chip.gray{background:#E5E7EB;color:#374151}.chip.ok{background:#B7F5CC;color:#064E3B}.chip.warn{background:#FFE08A;color:#6B3A00}
.bar{height:8px;background:#E0E0E0;border-radius:4px;margin-top:6px}.bar i{display:block;height:8px;background:var(--blue);border-radius:4px}
button{font-size:18px;font-weight:700;letter-spacing:.4px;min-height:52px;border-radius:12px;cursor:pointer}
.btn{width:100%;border:0;background:var(--orange);color:var(--navy);margin-top:12px}
.btn.out{background:#fff;border:2px solid var(--orange);color:#B00000}
.btn:disabled{background:#D1D5DB;color:#374151;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
label{display:block;font-weight:700;margin-top:12px}
input,select{width:100%;min-height:48px;margin-top:4px;padding:0 12px;border:1px solid #A3A3A3;border-radius:10px;font:600 16px 'Barlow Semi Condensed',sans-serif;background:#fff;color:var(--ink)}
.secs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.secs button{min-height:48px;padding:0 14px;font-size:15px;border:2px solid #A3A3A3;background:#fff;color:#374151;border-radius:99px}
.secs button[aria-pressed=true]{border-color:var(--orange);background:#FFDADA;color:#7A0000}
.clockbar{background:#FFDADA;border-radius:14px;padding:12px 14px;margin-top:4px}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:700;background:#FFE08A;color:#6B3A00}
.msg.ok{background:#B7F5CC;color:#064E3B}.msg.bad{background:#FFC9C9;color:#7A0F0F}
.tabs{display:flex;gap:8px;margin-bottom:4px}.tabs button{flex:1;min-height:48px;font-size:15px;border:2px solid #A3A3A3;background:#fff;color:#374151}
.tabs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.num{font-size:22px;font-weight:700}
.acts{display:flex;gap:10px;margin-top:10px}
.acts .btn{flex:1;margin-top:0;min-height:48px;font-size:15px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;font-family:Oswald,sans-serif;font-weight:700;letter-spacing:.4px;border-radius:12px;padding:0 8px}
.addr{font-weight:700;margin-top:4px;user-select:text;-webkit-user-select:text}
.btn.sm{width:auto;min-height:44px;font-size:15px;padding:0 14px;margin-top:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:#F1F1F1;border-radius:10px;padding:8px 10px}.stat b{display:block;font-size:17px}
.hrs{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:4px}

<script>

const hoy = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

const S = { token: localStorage.getItem('rl_token'), user: JSON.parse(localStorage.getItem('rl_user') || 'null'), view: (localStorage.getItem('rl_mode') || localStorage.getItem('rl_api')) ? 'login' : 'setup', tab: 'trabajos', jobs: [], clock: null, job: null, sec: null, etapa: ETAPAS[0], dist: null, gps: '', hours: [], msg: null, busy: false, zona: null, ajustes: null, tipoPrev: '', g: {}, recibo: null, casas: [], casa: null, secs: [], team: [], secsFor: null, panel: null, eq: [], uList: [], pinFor: null, cl: null, man: {}, gastos: [], gtot: 0, map: null, avisos: [], ack: [], clima: {}, prueba: null };

async function api(action, data = {}) {

// ----- Copiar la dirección y abrirla en el mapa -----

const accionesDir = (j, id) => '<div class="acts"><button class="btn out" type="button" data-copy="' + esc(id) + '">Copiar dirección</button><a class="btn" href="' + esc(navUrl(j)) + '" target="_blank" rel="noopener">Cómo llegar</a></div>';
const jobPorId = id => id === '__form' ? S.casa : (job(id) || S.casas.find(x => x.id === id));

const avisoKey = a => a.t + '|' + a.trabajo + '|' + a.tipo;
function setAvisos(list) {

  const antes = (S.avisos || []).map(avisoKey), nuevo = list.some(a => antes.indexOf(avisoKey(a)) < 0 && S.ack.indexOf(avisoKey(a)) < 0);

async function loadClima(id, forzar) {
  const c = S.clima[id];
  if (!id || (c && (c.cargando || (!forzar && c.data && Date.now() - c.t < 300000)))) return;
  S.clima[id] = { cargando: true, t: Date.now() }; if (!S.busy) render();

function climaCard(id) {

  (d.avisos || []).forEach(x => { h += '<div class="msg ' + (x.nivel === 'alerta' ? 'bad' : '') + '">' + esc(x.texto) + '</div>'; });
  return h + '<div class="sub" style="margin-top:8px">Fuente: ' + esc(d.fuente) + ' · pronóstico por hora, actualizado ' + hm(c.t) + '. Es un aviso temprano, no una garantía: usa tu criterio en el techo.</div></div>';

function pruebaTxt(p) {
  if (!p) return '';
  const c = { enviado: 'Correo de prueba enviado a tu correo.', sin: 'Tu usuario no tiene correo en la hoja Usuarios (columna Correo): por eso no te llegan avisos por correo.', fallo: 'Google no dejó enviar el correo de prueba.', demo: 'Modo de prueba: no se manda ningún correo de verdad.' }[p.correo] || '';

    : ({ sin_casas: 'No hay casas pendientes con ubicación en el mapa para probar.', cobertura: 'Esa dirección está fuera de EE. UU.: el servicio gratuito no la cubre.', gps: 'La casa de prueba no tiene ubicación en el mapa.',

function demoState() {
  return JSON.parse(localStorage.getItem('rl_demo') || 'null') || {
    jobs: [{ id: 'T-001', dir: '123 Main St', ciudad: 'Ejemplo', estado: 'IL', cp: '', contratista: 'Contratista A', cliente: '', tipo: 'Reemplazo completo', estatus: 'En proceso', lat: '', lng: '', radio: 150, fecha: '', notas: 'Dejar el patio limpio.', personas: [], todos: true,
      tareas: TAREAS_BASE['Reemplazo completo'].map(x => ({ tarea: x, hecha: false })), fotos: { antes: 0, despues: 0 } }],
    clock: null, horas: [], gastos: [], eventos: [], zona: {}, avisos: [], ajustes: { zona: true, llega: true, termina: false, climaActivo: false, climaMin: 20, climaViento: 25, climaCuadrilla: true, climaOM: false },
    users: [{ nombre: 'Dueño Demo', usuario: 'dueno', rol: 'Super usuario', activo: true }, { nombre: 'Trabajador Demo', usuario: 'demo', rol: 'Trabajador', activo: true }] };

const WK = 'Trabajador Demo';
const dirDe = j => [j.dir, j.ciudad].filter(Boolean).join(', ');
const r15 = ms => Math.round(ms / 900000) * 900000;
const hm = ms => new Date(ms).toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit' });
const dm = ms => new Date(ms).toLocaleDateString('es', { day: '2-digit', month: '2-digit' });
function demoApi(action, r) {
  const d = demoState(), save = () => localStorage.setItem('rl_demo', JSON.stringify(d)), job0 = id => d.jobs.find(x => x.id === id);
  d.avisos = d.avisos || []; d.ajustes = Object.assign({ zona: true, llega: true, termina: false, climaActivo: false, climaMin: 20, climaViento: 25, climaCuadrilla: true, climaOM: false }, d.ajustes);
  const avisosDemo = () => d.avisos.filter(a => Date.now() - a.t < 90 * 60000);
  const activo = j => j.estatus === 'Pendiente' || j.estatus === 'En proceso', visible = j => j.todos || j.personas.indexOf(WK) >= 0;
  const reloj = () => d.clock ? [{ usuario: 'demo', nombre: WK, rol: 'Trabajador', dir: dirDe(job0(d.clock.trabajo)), desde: hm(d.clock.entrada), lat: d.clock.lat, lng: d.clock.lng, sin: Date.now() - d.clock.entrada > 14 * 3600000 }] : [];

  const cierra = (ms, extra) => { const a = d.clock.entrada, fa = r15(a), fb = r15(ms), j = job0(d.clock.trabajo); d.horas.push({ fecha: dm(a), dir: dirDe(j), entrada: hm(a), salida: hm(ms), entradaR: hm(fa), salidaR: hm(fb), horas: Math.max(0, (fb - fa) / 3600000), nota: extra || '' }); evento('termino', j); d.clock = null; };

  }
  if (action === 'trabajos') return { ok: true, clock: d.clock, jobs: d.jobs.filter(j => activo(j) && visible(j)).map(j => ({ id: j.id, dir: dirDe(j), tipo: j.tipo, estatus: j.estatus, lat: j.lat, lng: j.lng, radio: j.radio, fecha: j.fecha || '', notas: j.notas || '', tareas: j.tareas, fotos: j.fotos, completa: dirTexto(j) }))
    .sort((a, b) => (a.fecha || '9') < (b.fecha || '9') ? -1 : (a.fecha || '9') > (b.fecha || '9') ? 1 : 0), avisos: avisosDemo() };

      else if (j.lat !== '' && r.lat != null) { const m = meters(r.lat, r.lng, j.lat, j.lng); if (m > j.radio) return { ok: false, error: 'fuera', dist: Math.round(m) }; }
      d.clock = { trabajo: j.id, entrada: Date.now(), lat: r.lat == null ? null : r.lat, lng: r.lng == null ? null : r.lng }; evento('llego', j); save(); return { ok: true, entrada: d.clock.entrada };

  if (action === 'foto') {

  if (action === 'horaManual') {

    if (!(mins > 0)) return { ok: false, error: 'hora' };

  }
  if (action === 'gasto') { if (!(Number(r.monto) > 0)) return { ok: false, error: 'monto' }; d.gastos.push({ fecha: r.fecha || hoy(), categoria: r.categoria, descripcion: r.descripcion || '', monto: Number(r.monto) }); save(); return { ok: true }; }

async function checkZona() {
  if (isAdmin() || S.clock || !S.token || !S.jobs.length || !navigator.geolocation || S.view === 'login' || S.view === 'setup') return;
  let pos; try { pos = await getPos(); } catch (e) { return; }
  const c = S.jobs.filter(j => j.lat !== '' && j.lat != null).map(j => ({ j, d: meters(pos.lat, pos.lng, j.lat, j.lng) })).filter(x => x.d <= x.j.radio).sort((a, b) => a.d - b.d)[0];
  const antes = JSON.stringify(S.zona);
  S.zona = c ? { id: c.j.id, dir: c.j.dir } : null;
  if (c) { const k = 'rl_z_' + c.j.id + '_' + hoy(); if (!localStorage.getItem(k)) { try { const r = await api('enZona', { trabajo: c.j.id, lat: pos.lat, lng: pos.lng }); if (r.ok) localStorage.setItem(k, '1'); } catch (e) { } } }
  if (antes !== JSON.stringify(S.zona) && !S.busy) render();
}
